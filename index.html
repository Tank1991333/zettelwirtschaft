<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Zettelwirtschaft</title>
<meta name="description" content="Pickerl, Reifen, Service, Versicherungen, Verträge und Ausweise der ganzen Familie an einem Ort – alle Daten bleiben lokal am Gerät.">
<meta name="theme-color" content="#2D6CDF">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Zettelwirtschaft">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Manrope:wght@400;500;600;700&family=Nunito:wght@400;600;700;800&family=Fredoka:wght@500;600&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#ECEFF2; --paper:#FFFFFF; --ink:#18232E; --muted:#5E6B78; --line:#D5DBE1;
  --petrol:#1D5E6A; --petrol-soft:#DCEBEC; --amber:#B97F08; --amber-soft:#FBEFD2;
  --red:#B23A2B; --red-soft:#F7DEDA; --green:#2F7A45; --green-soft:#DDEFE2;
  --note:#FFF6D8; --note-line:#E9D9A4;
  --display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --body:"Manrope", "Segoe UI", system-ui, -apple-system, sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#121A21; --paper:#1B252E; --ink:#E6ECF1; --muted:#9AA8B5; --line:#2C3943;
    --petrol:#5FB3BF; --petrol-soft:#1D3A40; --amber:#E7B240; --amber-soft:#3B3018;
    --red:#EE7B6B; --red-soft:#43231F; --green:#6CC287; --green-soft:#1F3826;
    --note:#2F2A1A; --note-line:#4A4126;
  }
}
:root[data-theme="dark"]{
  --bg:#121A21; --paper:#1B252E; --ink:#E6ECF1; --muted:#9AA8B5; --line:#2C3943;
  --petrol:#5FB3BF; --petrol-soft:#1D3A40; --amber:#E7B240; --amber-soft:#3B3018;
  --red:#EE7B6B; --red-soft:#43231F; --green:#6CC287; --green-soft:#1F3826;
  --note:#2F2A1A; --note-line:#4A4126;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 var(--body);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--petrol);outline-offset:2px}
a{color:var(--petrol)}
.wrap{max-width:980px;margin:0 auto;padding:20px 16px 120px}
header.top{display:flex;flex-wrap:wrap;align-items:center;gap:6px 14px;margin-bottom:12px}
.logo{width:40px;height:40px;flex:none}
h1{font:700 30px/1.1 var(--display);margin:0;letter-spacing:-.01em}
#sync{font-size:13px;color:var(--muted);flex-basis:100%;margin-left:54px;margin-top:-4px}
h2{font:700 21px/1.2 var(--display);margin:28px 0 12px}
h3{font:600 17px/1.3 var(--display);margin:0}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 18px}
.chip{border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:6px 14px;cursor:pointer;display:inline-flex;align-items:center;gap:8px;font-weight:600;font-size:14px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block;flex:none}
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--paper);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
nav.tabs button{flex:1;max-width:150px;min-width:0;background:none;border:0;padding:9px 2px 11px;cursor:pointer;color:var(--muted);font-weight:600;font-size:12px;display:flex;flex-direction:column;align-items:center;gap:3px;border-top:3px solid transparent}
nav.tabs button span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
nav.tabs button svg{width:22px;height:22px}
nav.tabs button[aria-current="page"]{color:var(--petrol);border-top-color:var(--petrol)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.stat{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
.stat b{display:block;font:700 26px/1.2 var(--display)}
.stat span{color:var(--muted);font-size:14px}
.list{display:flex;flex-direction:column;gap:8px}
.row{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:12px 14px;display:flex;gap:14px;align-items:center}
.row .main{flex:1;min-width:0}
.sub{color:var(--muted);font-size:13.5px;overflow-wrap:anywhere}
.row .acts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.badge{width:58px;height:58px;border-radius:50%;flex:none;display:flex;flex-direction:column;align-items:center;justify-content:center;border:3px solid currentColor;color:var(--petrol);background:var(--petrol-soft);position:relative;line-height:1}
.badge .m{font:700 19px/1 var(--display)}
.badge .y{font-size:11px;font-weight:700;margin-top:2px}
.badge::after{content:"";position:absolute;inset:4px;border-radius:50%;border:1px dashed currentColor;opacity:.45}
.badge.soon{color:var(--amber);background:var(--amber-soft)}
.badge.late{color:var(--red);background:var(--red-soft)}
.badge.done{color:var(--green);background:var(--green-soft)}
.badge.doc{border-radius:12px}
.badge.doc::after{border-radius:8px}
.tag{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;padding:2px 8px;border-radius:6px;background:var(--bg);color:var(--muted);margin:2px 4px 0 0;text-decoration:none}
.late-txt{color:var(--red);font-weight:700}
.soon-txt{color:var(--amber);font-weight:700}
.btn{border:1px solid var(--line);background:var(--paper);border-radius:8px;padding:7px 12px;cursor:pointer;font-weight:600;font-size:14px;white-space:nowrap;text-decoration:none;color:var(--ink);display:inline-flex;align-items:center;gap:6px}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--petrol);border-color:var(--petrol);color:#fff}
:root[data-theme="dark"] .btn.primary{color:#0E1A1D}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .btn.primary{color:#0E1A1D}}
.btn.ok{color:var(--green);border-color:var(--green)}
.btn.ghost{border-color:transparent;background:none;color:var(--muted)}
.btn.danger{color:var(--red);border-color:var(--red)}
.btn:disabled{opacity:.5;cursor:wait}
.bar{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin:24px 0 12px}
.bar h2{margin:0}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--paper);flex-wrap:wrap}
.seg button{border:0;background:none;padding:7px 14px;cursor:pointer;font-weight:600;font-size:14px}
.seg button[aria-pressed="true"]{background:var(--petrol-soft);color:var(--petrol)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:12px}
.card{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:16px;display:flex;flex-direction:column;gap:10px}
.plate{display:inline-block;font:700 14px/1 var(--body);letter-spacing:.06em;border:2px solid var(--ink);border-radius:4px;padding:4px 8px 4px 14px;position:relative;background:var(--paper);white-space:nowrap}
.plate::before{content:"";position:absolute;left:0;top:0;bottom:0;width:7px;background:#1F4FA3}
.kv{display:grid;grid-template-columns:auto 1fr;gap:2px 12px;font-size:14px;margin:0}
.kv dt{color:var(--muted)} .kv dd{margin:0;font-weight:600;text-align:right}
.empty{background:var(--paper);border:1px dashed var(--line);border-radius:10px;padding:22px;text-align:center;color:var(--muted)}
.empty .btn{margin-top:10px}
.fab{position:fixed;right:18px;bottom:calc(76px + env(safe-area-inset-bottom,0px));z-index:6;border-radius:999px;padding:12px 18px;box-shadow:0 4px 14px rgba(0,0,0,.18)}
details summary{cursor:pointer;color:var(--petrol);font-weight:600;font-size:14px}
.hist{margin-top:8px;font-size:13.5px}
.hist div{display:flex;justify-content:space-between;gap:10px;border-top:1px solid var(--line);padding:5px 0}
.hist .sum{font-weight:700}
/* Kompakte Liste (Übersicht) */
.clist{background:var(--paper);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.ci{display:flex;align-items:center;gap:10px;padding:9px 12px 9px 0;border-top:1px solid var(--line);border-left:4px solid var(--petrol-soft)}
.ci:first-child{border-top:0}
.ci.soon{border-left-color:var(--amber)} .ci.late{border-left-color:var(--red)}
.ci .when{width:54px;white-space:nowrap;flex:none;text-align:center;line-height:1.15;font-weight:700;font-size:14px;color:var(--petrol)}
.ci .when small{display:block;font-size:11px;font-weight:600;color:var(--muted)}
.ci.soon .when{color:var(--amber)} .ci.late .when{color:var(--red)}
.ci .open{flex:1;min-width:0;background:none;border:0;padding:0;text-align:left;cursor:pointer}
.ci .t{font-weight:600;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ci .s{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ci .chk{width:34px;height:34px;flex:none;border-radius:50%;border:2px solid var(--line);background:none;cursor:pointer;color:var(--green);display:flex;align-items:center;justify-content:center}
.ci .chk:hover{border-color:var(--green);background:var(--green-soft)}
.ci .chk svg{width:18px;height:18px}
.ci .spacer{width:34px;flex:none}
.more-link{display:block;margin-top:10px;background:none;border:0;padding:4px 0;color:var(--petrol);font-weight:600;cursor:pointer}
/* Hinweis-Zettel */
.notes{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px;margin-top:18px}
.note{background:var(--note);border:1px solid var(--note-line);padding:16px 16px 14px;border-radius:3px;box-shadow:0 2px 0 var(--note-line);transform:rotate(-.5deg)}
.note:nth-child(2n){transform:rotate(.6deg)}
.note h3{margin-bottom:4px}
.note p{margin:0 0 10px;font-size:14px}
/* Anhänge */
.files{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.files a.th,.files .th{width:52px;height:52px;border-radius:8px;border:1px solid var(--line);overflow:hidden;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:var(--muted);background:var(--bg);text-decoration:none;position:relative}
.files img{width:100%;height:100%;object-fit:cover}
.files button.th{padding:0;cursor:pointer}
.fab[hidden]{display:none}
.files .rm{position:absolute;top:1px;right:1px;width:20px;height:20px;border-radius:50%;border:0;background:var(--ink);color:var(--bg);font-size:12px;line-height:20px;cursor:pointer;padding:0}
/* Auswertung */
.bars{display:flex;flex-direction:column;gap:8px}
.bars .b{display:grid;grid-template-columns:minmax(90px,170px) 1fr auto;gap:10px;align-items:center;font-size:14px}
.bars .track{height:14px;background:var(--bg);border-radius:4px;overflow:hidden}
.bars .fill{height:100%;background:var(--petrol);border-radius:4px}
.cols{display:flex;align-items:flex-end;gap:6px;height:170px;padding-top:10px}
.cols .c{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:4px;min-width:0}
.cols .c i{display:block;width:100%;max-width:38px;background:var(--petrol);border-radius:4px 4px 0 0;min-height:2px}
.cols .c span{font-size:11px;color:var(--muted)}
.panel{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:12px}
.panel h3{margin-bottom:12px}
/* Dialog */
dialog{border:0;border-radius:14px;padding:0;width:min(560px,calc(100% - 24px));background:var(--paper);color:var(--ink);max-height:calc(100% - 40px)}
dialog::backdrop{background:rgba(10,20,28,.5)}
.dlg-h{padding:18px 20px 6px}
.dlg-b{padding:8px 20px;display:grid;grid-template-columns:1fr 1fr;gap:12px}
.dlg-f{padding:14px 20px 18px;display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.fld{display:flex;flex-direction:column;gap:4px;min-width:0}
.fld.full{grid-column:1/-1}
.fld > label{font-size:13px;font-weight:600;color:var(--muted)}
.fld input,.fld select,.fld textarea{border:1px solid var(--line);border-radius:8px;padding:9px 10px;background:var(--bg);width:100%}
.fld textarea{min-height:64px;resize:vertical}
.check{display:flex;gap:8px;align-items:center;grid-column:1/-1;font-weight:600}
.hint{grid-column:1/-1;font-size:13px;color:var(--muted);margin:0}
.err{grid-column:1/-1;color:var(--red);font-weight:600;font-size:14px;margin:0}
.swatches{display:flex;gap:8px;flex-wrap:wrap}
.swatches button{width:30px;height:30px;border-radius:50%;border:3px solid transparent;cursor:pointer}
.swatches button[aria-pressed="true"]{border-color:var(--ink)}
.prose p{margin:0 0 10px;max-width:68ch}
@media (max-width:560px){
  .dlg-b{grid-template-columns:1fr}
  .row{flex-wrap:wrap}
  .row .acts{width:100%;justify-content:flex-start;padding-left:72px}
  h1{font-size:26px}
  nav.tabs button{font-size:10.5px}
  .stat{padding:12px}
  .stat b{font-size:21px}
  .stat span{font-size:12.5px;display:block;line-height:1.35}
}
@media (prefers-reduced-motion:no-preference){
  dialog[open]{animation:pop .16s ease-out}
  @keyframes pop{from{transform:translateY(8px);opacity:0}}
}

/* ===== Symbole, Begrüßung, Bereiche (alle Designs) ===== */
:root{--c-auto:#2F6FD0;--c-haus:#D9822B;--c-ges:#2E9A5B;--c-sonst:#7A8592;--c-ins:#7C5CD6;--c-abo:#1E9AA8;--c-doc:#D2477E;--hard:var(--ink);--edge:var(--line)}
:root[data-theme="dark"]{--c-auto:#6FA3F2;--c-haus:#F0A65C;--c-ges:#5FCB8C;--c-sonst:#A3ADB8;--c-ins:#A98BF2;--c-abo:#55C6D3;--c-doc:#F07BA8;}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--c-auto:#6FA3F2;--c-haus:#F0A65C;--c-ges:#5FCB8C;--c-sonst:#A3ADB8;--c-ins:#A98BF2;--c-abo:#55C6D3;--c-doc:#F07BA8;}}
.ico{width:34px;height:34px;border-radius:10px;flex:none;display:inline-flex;align-items:center;justify-content:center;color:var(--ic,var(--petrol));background:color-mix(in srgb,var(--ic,var(--petrol)) 15%,var(--paper))}
.ico svg{width:19px;height:19px}
h3.ttl{display:flex;align-items:center;gap:10px}
h3.ttl > span:last-child{min-width:0;overflow-wrap:anywhere}
.btn svg{width:16px;height:16px;flex:none}
.skinbtn{margin-left:auto;padding:8px}
.skinbtn svg{width:22px;height:22px}
.hello{margin:2px 0 16px}
.hello .hi{font:700 25px/1.2 var(--display);display:flex;align-items:center;gap:10px}
.hello .hi svg{width:28px;height:28px;color:var(--amber)}
.hello .sub{font-size:15px;margin-top:2px}
.areas{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin:14px 0 4px}
.area{border:1px solid var(--line);background:var(--paper);border-radius:12px;padding:12px;display:flex;align-items:center;gap:10px;cursor:pointer;text-align:left;min-width:0}
.area b{display:block;font-size:15px}
.area span.s{display:block;font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.area span.s.warn{color:var(--amber);font-weight:700}
.area span.s.bad{color:var(--red);font-weight:700}
.ci .ico{margin-right:2px}
.skins{display:flex;flex-direction:column;gap:10px;padding:8px 20px}
.skin-opt{display:flex;gap:14px;align-items:center;border:2px solid var(--line);border-radius:14px;padding:12px 14px;background:var(--paper);text-align:left;cursor:pointer;width:100%}
.skin-opt[aria-pressed="true"]{border-color:var(--petrol);background:var(--petrol-soft)}
.skin-opt b{display:block;font-size:16px}
.skin-opt span{font-size:13px;color:var(--muted)}
.skin-opt .sw{display:flex;flex:none}
.skin-opt .sw i{width:22px;height:22px;border-radius:50%;margin-right:-6px;border:2px solid var(--paper);display:block}

/* ===== Design: Sanft ===== */
:root[data-skin="sanft"]{--bg:#F2F4FA;--paper:#FFFFFF;--ink:#262A3F;--muted:#686D86;--line:#E3E6F0;--petrol:#4F63E3;--petrol-soft:#E6E9FC;--note:#FFF4D6;--note-line:#F2E2AE;--display:"Nunito","Segoe UI",system-ui,sans-serif;--body:"Nunito","Segoe UI",system-ui,sans-serif;--shadow:0 4px 18px rgba(38,42,90,.08)}
:root[data-skin="sanft"][data-theme="dark"]{--bg:#15172A;--paper:#1F2238;--ink:#ECEEF8;--muted:#A3A8C3;--line:#2E3250;--petrol:#8D9BFF;--petrol-soft:#2A2F5A;--note:#2E2A1C;--note-line:#4A4227;--shadow:0 4px 18px rgba(0,0,0,.25)}
@media (prefers-color-scheme: dark){:root[data-skin="sanft"]:not([data-theme="light"]){--bg:#15172A;--paper:#1F2238;--ink:#ECEEF8;--muted:#A3A8C3;--line:#2E3250;--petrol:#8D9BFF;--petrol-soft:#2A2F5A;--note:#2E2A1C;--note-line:#4A4227;--shadow:0 4px 18px rgba(0,0,0,.25)}}

[data-skin="sanft"] h1{font-weight:800}
[data-skin="sanft"] h2,[data-skin="sanft"] .hello .hi{font-weight:800}
[data-skin="sanft"] :is(.stat,.card,.row,.panel,.empty,.clist,.area){border:0;border-radius:20px;box-shadow:var(--shadow)}
[data-skin="sanft"] .chip{border:0;box-shadow:var(--shadow)}
[data-skin="sanft"] .btn{border-radius:999px}
[data-skin="sanft"] .btn.ghost{background:none}
[data-skin="sanft"] .seg{border:0;border-radius:999px;box-shadow:var(--shadow);padding:3px}
[data-skin="sanft"] .seg button{border-radius:999px}
[data-skin="sanft"] .ico{border-radius:50%}
[data-skin="sanft"] .area{flex-direction:column;align-items:flex-start;padding:14px}
[data-skin="sanft"] .area .ico{width:42px;height:42px}
[data-skin="sanft"] .area .ico svg{width:22px;height:22px}
[data-skin="sanft"] .ci{border-left:0;padding:11px 14px 11px 4px}
[data-skin="sanft"] .badge{border-radius:18px;border-width:2px}
[data-skin="sanft"] .badge::after{border-radius:13px}
[data-skin="sanft"] .note{transform:none;border:0;border-radius:20px;box-shadow:var(--shadow)}
[data-skin="sanft"] nav.tabs{left:8px;right:8px;bottom:calc(8px + env(safe-area-inset-bottom,0px));border:0;border-radius:26px;box-shadow:0 8px 30px rgba(38,42,90,.18);padding:3px}
[data-skin="sanft"] nav.tabs button{border-top:0;border-radius:20px;padding:8px 0;font-size:10.5px}
[data-skin="sanft"] nav.tabs button[aria-current="page"]{background:var(--petrol-soft);color:var(--petrol)}
[data-skin="sanft"] .fab{bottom:calc(96px + env(safe-area-inset-bottom,0px))}
[data-skin="sanft"] dialog{border-radius:24px}
[data-skin="sanft"] .fld input,[data-skin="sanft"] .fld select,[data-skin="sanft"] .fld textarea{border-radius:12px;border-color:transparent}

/* ===== Design: Bunt ===== */
:root[data-skin="bunt"]{--bg:#FFF6E5;--paper:#FFFFFF;--ink:#1E1B2E;--muted:#5B5870;--line:#E9DFC9;--petrol:#2D6CDF;--petrol-soft:#DDE8FB;--note:#FFE7A3;--note-line:#1E1B2E;--edge:#1E1B2E;--hard:#1E1B2E;--c-auto:#2D6CDF;--c-haus:#FF8A1F;--c-ges:#16A970;--c-sonst:#7D8396;--c-ins:#8B5CF6;--c-abo:#0FA3B1;--c-doc:#E8417A;--display:"Fredoka","Nunito",system-ui,sans-serif;--body:"Nunito","Segoe UI",system-ui,sans-serif}
:root[data-skin="bunt"][data-theme="dark"]{--bg:#1A1726;--paper:#262236;--ink:#F4F1FA;--muted:#B8B3CB;--line:#3A3550;--petrol:#6E9BFF;--petrol-soft:#28335A;--note:#4A3E16;--note-line:#000;--edge:#57507A;--hard:#000;--c-auto:#5D8FFF;--c-haus:#FF9C42;--c-ges:#2DC98A;--c-sonst:#9EA4B7;--c-ins:#A685FF;--c-abo:#2BC3D1;--c-doc:#FF5E95}
@media (prefers-color-scheme: dark){:root[data-skin="bunt"]:not([data-theme="light"]){--bg:#1A1726;--paper:#262236;--ink:#F4F1FA;--muted:#B8B3CB;--line:#3A3550;--petrol:#6E9BFF;--petrol-soft:#28335A;--note:#4A3E16;--note-line:#000;--edge:#57507A;--hard:#000;--c-auto:#5D8FFF;--c-haus:#FF9C42;--c-ges:#2DC98A;--c-sonst:#9EA4B7;--c-ins:#A685FF;--c-abo:#2BC3D1;--c-doc:#FF5E95}}

[data-skin="bunt"] h1,[data-skin="bunt"] h2,[data-skin="bunt"] h3,[data-skin="bunt"] .hello .hi{font-weight:600}
[data-skin="bunt"] :is(.stat,.card,.row,.panel,.empty,.clist,.note){border:2px solid var(--edge);border-radius:16px;box-shadow:4px 4px 0 var(--hard)}
[data-skin="bunt"] .note{transform:rotate(-1deg)}
[data-skin="bunt"] .chip{border:2px solid var(--edge)}
[data-skin="bunt"] .btn{border:2px solid var(--edge);border-radius:12px;box-shadow:2px 2px 0 var(--hard)}
[data-skin="bunt"] .btn:active{transform:translate(2px,2px);box-shadow:none}
[data-skin="bunt"] .btn.ghost{border-color:transparent;box-shadow:none}
[data-skin="bunt"] .seg{border:2px solid var(--edge);border-radius:12px}
[data-skin="bunt"] .ico{border-radius:12px;background:var(--ic);color:#fff}
[data-skin="bunt"] .area{flex-direction:column;align-items:flex-start;background:var(--ic);border:2px solid var(--edge);border-radius:16px;box-shadow:4px 4px 0 var(--hard);color:#fff;padding:14px}
[data-skin="bunt"] .area .ico{background:rgba(255,255,255,.25);width:44px;height:44px}
[data-skin="bunt"] .area .ico svg{width:24px;height:24px}
[data-skin="bunt"] .area span.s,[data-skin="bunt"] .area span.s.warn,[data-skin="bunt"] .area span.s.bad{color:rgba(255,255,255,.92)}
[data-skin="bunt"] .area b{font-family:var(--display);font-weight:600;font-size:17px}
[data-skin="bunt"] .stat b{color:var(--petrol)}
[data-skin="bunt"] .stat:nth-child(2) b{color:var(--c-haus)} [data-skin="bunt"] .stat:nth-child(3) b{color:var(--c-ins)} [data-skin="bunt"] .stat:nth-child(4) b{color:var(--c-ges)}
[data-skin="bunt"] .ci{border-left:0;border-top:2px dashed var(--line)}
[data-skin="bunt"] .ci:first-child{border-top:0}
[data-skin="bunt"] .ci.late .when,[data-skin="bunt"] .ci.soon .when{border-radius:10px;margin-left:6px;padding:4px 0;width:52px}
[data-skin="bunt"] .ci.late .when{background:var(--red);color:#fff} [data-skin="bunt"] .ci.late .when small{color:#fff}
[data-skin="bunt"] .ci.soon .when{background:var(--amber-soft)}
[data-skin="bunt"] .ci .chk{border:2px solid var(--edge)}
[data-skin="bunt"] .badge{border-radius:16px}
[data-skin="bunt"] .badge::after{border-radius:11px}
[data-skin="bunt"] nav.tabs{border-top:2px solid var(--edge)}
[data-skin="bunt"] nav.tabs button{border-top:0}
[data-skin="bunt"] nav.tabs button svg{width:30px;height:30px;padding:4px;border-radius:10px}
[data-skin="bunt"] nav.tabs button[aria-current="page"] svg{background:var(--petrol);color:#fff}
[data-skin="bunt"] nav.tabs button[aria-current="page"]{color:var(--ink)}
[data-skin="bunt"] .fab{border:2px solid var(--edge);box-shadow:4px 4px 0 var(--hard)}
[data-skin="bunt"] dialog{border:2px solid var(--edge);border-radius:20px}

/* ===== Design: Klar ===== */
:root[data-skin="klar"]{--bg:#FFFFFF;--paper:#FFFFFF;--ink:#14171A;--muted:#68707A;--line:#E7E9EC;--petrol:#0E8F6E;--petrol-soft:#E2F4EE;--note:#F3F6F4;--note-line:#E7E9EC;--display:"DM Sans","Segoe UI",system-ui,sans-serif;--body:"DM Sans","Segoe UI",system-ui,sans-serif}
:root[data-skin="klar"][data-theme="dark"]{--bg:#0F1214;--paper:#0F1214;--ink:#ECEFF1;--muted:#98A1AA;--line:#252B30;--petrol:#3CC79F;--petrol-soft:#11302A;--note:#161B1E;--note-line:#252B30}
@media (prefers-color-scheme: dark){:root[data-skin="klar"]:not([data-theme="light"]){--bg:#0F1214;--paper:#0F1214;--ink:#ECEFF1;--muted:#98A1AA;--line:#252B30;--petrol:#3CC79F;--petrol-soft:#11302A;--note:#161B1E;--note-line:#252B30}}

[data-skin="klar"] h1{font-weight:700;letter-spacing:-.03em}
[data-skin="klar"] h2{font-weight:700;letter-spacing:-.02em}
[data-skin="klar"] .hello .hi{font-size:30px;letter-spacing:-.03em}
[data-skin="klar"] .stats{gap:0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
[data-skin="klar"] .stat{border:0;border-radius:0;background:none;padding:14px 4px}
[data-skin="klar"] .stat b{font-weight:500}
[data-skin="klar"] :is(.card,.panel,.empty){border-radius:14px}
[data-skin="klar"] .list{gap:0}
[data-skin="klar"] .row{border:0;border-bottom:1px solid var(--line);border-radius:0;padding:14px 0;background:none}
[data-skin="klar"] .chip{border-radius:8px}
[data-skin="klar"] .chip[aria-pressed="true"]{background:var(--petrol);border-color:var(--petrol);color:#fff}
[data-skin="klar"] .ico{border-radius:50%;background:var(--paper);border:1.5px solid var(--ic);position:relative;z-index:1}
[data-skin="klar"] .area{border-radius:12px}
[data-skin="klar"] .clist{border:0;background:none;position:relative;border-radius:0}
[data-skin="klar"] .clist::before{content:"";position:absolute;left:81px;top:14px;bottom:14px;width:2px;background:var(--line)}
[data-skin="klar"] .ci{border:0;padding:10px 0}
[data-skin="klar"] .ci .when{text-align:right;padding-right:4px;color:var(--ink)}
[data-skin="klar"] .ci.late .ico{border-color:var(--red);color:var(--red);background:var(--red-soft)}
[data-skin="klar"] .ci.soon .ico{border-color:var(--amber)}
[data-skin="klar"] .ci .chk{border:1.5px solid var(--line)}
[data-skin="klar"] .badge{border-width:2px}
[data-skin="klar"] .note{transform:none;border:0;border-radius:14px;box-shadow:none}
[data-skin="klar"] nav.tabs button{border-top:0;position:relative}
[data-skin="klar"] nav.tabs button[aria-current="page"]::after{content:"";position:absolute;bottom:4px;width:5px;height:5px;border-radius:50%;background:var(--petrol)}
[data-skin="klar"] .fab{border-radius:14px}

/* ===== Bedienung: Varianten ===== */
.menubtn{display:none;padding:8px}
.menubtn svg{width:24px;height:24px}
:root[data-nav="liste"] .menubtn{display:inline-flex}
:root[data-nav="liste"] .logo{display:none}
:root[data-nav="liste"] #sync{margin-left:48px}
:root[data-nav="kacheln"] nav.tabs,:root[data-nav="liste"] nav.tabs{display:none}
:root[data-nav="kacheln"] .fab{bottom:calc(20px + env(safe-area-inset-bottom,0px))}
:root[data-nav="liste"] .fab{left:50%;right:auto;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));width:64px;height:64px;padding:0;border-radius:50%;justify-content:center}
:root[data-nav="liste"] .fab svg{width:30px;height:30px}
.fab svg{width:18px;height:18px}
.backbar{margin:0 0 4px}
.backbar .btn{padding-left:2px;font-size:15px;color:var(--petrol)}
.launch{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;margin-top:16px}
.tile{min-height:132px;display:flex;flex-direction:column;justify-content:space-between;gap:10px;padding:16px;border-radius:18px;border:1px solid var(--line);background:var(--paper);cursor:pointer;text-align:left}
.tile .ico{width:52px;height:52px;border-radius:16px}
.tile .ico svg{width:28px;height:28px}
.tile b{display:block;font:700 17px/1.2 var(--display)}
.tile .s{display:block;font-size:13px;color:var(--muted);margin-top:2px}
.tile .s.warn{color:var(--amber);font-weight:700} .tile .s.bad{color:var(--red);font-weight:700}
.searchbox{position:relative;margin:4px 0 10px}
.searchbox svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:20px;height:20px;color:var(--muted)}
.searchbox input{width:100%;padding:12px 14px 12px 42px;border-radius:12px;border:1px solid var(--line);background:var(--paper);font-size:16px}
.fgroup{margin:18px 0 6px;font-size:12.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.fgroup.bad{color:var(--red)}
.swipehint{font-size:13px;color:var(--muted);margin:2px 0 0;display:flex;align-items:center;gap:6px}
.swipehint svg{width:16px;height:16px}
.ci{touch-action:pan-y;background:var(--paper);transition:transform .18s ease,background .18s ease}
.ci.swiping{transition:none}
.qgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:8px 20px}
.qbtn{display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 4px;border-radius:14px;border:1px solid var(--line);background:var(--paper);font-weight:600;font-size:13px;cursor:pointer;text-align:center;line-height:1.2}
.qbtn .ico{width:44px;height:44px;border-radius:14px}
.qbtn .ico svg{width:24px;height:24px}
.qhead{grid-column:1/-1;font-size:12.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-top:6px}
dialog#drawer{margin:0;height:100%;max-height:100%;width:min(300px,85vw);border-radius:0 18px 18px 0;padding:calc(14px + env(safe-area-inset-top,0px)) 0 calc(14px + env(safe-area-inset-bottom,0px))}
.dnav{display:flex;gap:12px;align-items:center;width:100%;padding:10px 18px;background:none;border:0;font-weight:600;font-size:16px;cursor:pointer;text-align:left;color:var(--ink)}
.dnav[aria-current="page"]{background:var(--petrol-soft);color:var(--petrol)}
.dnav .ico{width:36px;height:36px}
[data-skin="sanft"] :is(.tile,.qbtn){border:0;border-radius:22px;box-shadow:var(--shadow)}
[data-skin="sanft"] .tile .ico{border-radius:50%}
[data-skin="sanft"] .searchbox input{border:0;border-radius:999px;box-shadow:var(--shadow)}
[data-skin="bunt"] .tile{background:var(--ic);color:#fff;border:2px solid var(--edge);box-shadow:4px 4px 0 var(--hard)}
[data-skin="bunt"] .tile .ico{background:rgba(255,255,255,.25)}
[data-skin="bunt"] .tile b{font-weight:600}
[data-skin="bunt"] .tile .s,[data-skin="bunt"] .tile .s.warn,[data-skin="bunt"] .tile .s.bad{color:rgba(255,255,255,.92)}
[data-skin="bunt"] :is(.qbtn,.searchbox input){border:2px solid var(--edge);box-shadow:3px 3px 0 var(--hard)}
[data-skin="bunt"] .ci{border-left:0}
[data-skin="klar"] .tile{border-radius:14px}
[data-skin="klar"] .tile .ico{border-radius:50%}
</style>
</head>

/* Fotos & PDFs in IndexedDB */
const IDB = (() => {
  let p;
  const open = () => p || (p = new Promise((res,rej) => {
    const r = indexedDB.open("zettelwirtschaft", 1);
    r.onupgradeneeded = () => r.result.createObjectStore("files");
    r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
  }));
  const tx = async (mode, fn) => { const db = await open(); return new Promise((res,rej) => {
    const t = db.transaction("files", mode); const req = fn(t.objectStore("files"));
    t.oncomplete = () => res(req ? req.result : undefined); t.onerror = () => rej(t.error); t.onabort = () => rej(t.error);
  }); };
  return {
    get: id => tx("readonly", s => s.get(id)),
    put: (id, v) => tx("readwrite", s => s.put(v, id)),
    del: id => tx("readwrite", s => s.delete(id)),
    keys: () => tx("readonly", s => s.getAllKeys())
  };
})();
const urlCache = {};
async function blobFor(id){ try{ const r = await IDB.get(id); return r ? new Blob([r.data], {type:r.type}) : null; }catch(e){ return null; } }
async function urlFor(id){ if(urlCache[id]) return urlCache[id]; const b = await blobFor(id); return b ? (urlCache[id] = URL.createObjectURL(b)) : null; }
async function hydrate(root){ for(const el of root.querySelectorAll("img[data-fid]:not([src])")){ const u = await urlFor(el.dataset.fid); el.src = u || ("/_blob/" + el.dataset.fid); } }
const usedFileIds = () => { const u = new Set(); [S.vehicles,S.tasks,S.contracts,S.docs].forEach(a => a.forEach(x => (x.files||[]).forEach(f => u.add(f.id)))); return u; };
let cleanTimer = null;
function scheduleClean(){
  clearTimeout(cleanTimer);
  cleanTimer = setTimeout(async () => {
    if(dlg.open) return scheduleClean();
    try{ const used = usedFileIds(); for(const k of await IDB.keys()) if(!used.has(k)){ await IDB.del(k); if(urlCache[k]){ URL.revokeObjectURL(urlCache[k]); delete urlCache[k]; } } }catch(e){}
  }, 4000);
}

/* ================= Fristen-Logik ================= */
function pickerlWindow(due){
  const d = new Date(due+"T00:00"), y = d.getFullYear(), m = d.getMonth();
  return {from: ds(new Date(y, m-1, 1)), to: ds(new Date(y, m+5, 0))};
}
function taskStatus(t){
  if(t.done) return "done";
  if(!t.due) return "";
  const today = todayStr();
  if(t.kind === "pickerl"){
    const w = pickerlWindow(t.due);
    return today > w.to ? "late" : today >= w.from ? "soon" : "";
  }
  const n = daysUntil(t.due);
  return n < 0 ? "late" : n <= 30 ? "soon" : "";
}
function nextDue(kind, from, rep){
  const d = new Date(from+"T00:00"), y = d.getFullYear();
  if(kind === "reifen"){
    const c = [`${y}-04-01`,`${y}-10-15`,`${y+1}-04-01`,`${y+1}-10-15`].find(x => x > addDays(from,60));
    return c;
  }
  if(kind === "vignette") return d.getMonth() === 11 ? `${y+2}-01-31` : `${y+1}-01-31`;
  return rep > 0 ? addMonths(from, rep) : "";
}
function effRenewal(c){
  if(!c.renewal) return "";
  let r = c.renewal, g = 0;
  if(c.autoRenew !== false) while(daysUntil(r) < 0 && g++ < 60) r = addMonths(r, 12);
  return r;
}
function deadline(c){ const r = effRenewal(c); return r ? (Number(c.notice) ? addMonths(r, -Number(c.notice)) : r) : ""; }
function contractStatus(c){
  if(!c.renewal) return "";
  if(c.autoRenew === false && daysUntil(c.renewal) < 0) return "late";
  const n = daysUntil(deadline(c));
  return n >= 0 && n <= 60 ? "soon" : "";
}
function docWarn(d){ return DOC_TYPES[d.type] ?? 3; }
function docStatus(d){
  if(!d.expiry) return "";
  if(daysUntil(d.expiry) < 0) return "late";
  return daysUntil(addMonths(d.expiry, -docWarn(d))) <= 0 ? "soon" : "";
}

function badge(dateStr, cls, shape=""){

  return `<div class="badge ${cls||""} ${shape}" aria-hidden="true"><span class="m">${MONTHS[d.getMonth()]}</span><span class="y">${d.getFullYear()}</span></div>`;
}
function dueText(t){
  if(!t.due) return "ohne Termin";
  const st = taskStatus(t);
  if(t.kind === "pickerl"){
    const w = pickerlWindow(t.due);
    if(st === "late") return `<span class="late-txt">Frist abgelaufen am ${fmtD(w.to)}</span>`;
    if(st === "soon") return `<span class="soon-txt">Jetzt machen lassen – spätestens bis ${fmtD(w.to)}</span>`;
    return `Plakette ${MONTHS[new Date(t.due+"T00:00").getMonth()]} ${yearOf(t.due)} · möglich ab ${fmtD(w.from)}`;
  }
  const n = daysUntil(t.due);
  if(n < 0) return `<span class="late-txt">seit ${-n} ${-n===1?"Tag":"Tagen"} überfällig</span>`;
  if(n === 0) return `<span class="soon-txt">heute fällig</span>`;
  if(n <= 30) return `<span class="soon-txt">in ${n} ${n===1?"Tag":"Tagen"}</span> · ${fmtD(t.due)}`;
  return `fällig ${fmtD(t.due)}`;
}

function gcal(title, date, details){

}

function contractRow(c){
  const st = contractStatus(c), r = effRenewal(c), dl = deadline(c);
  let fr = "Kein Ablaufdatum";
  if(c.renewal){
    if(st === "late") fr = `<span class="late-txt">Abgelaufen am ${fmtD(c.renewal)}</span>`;

      fr = st === "soon" ? `<span class="soon-txt">${txt}</span>` : txt;

/* ================= Hinweis-Zettel (Saison) ================= */
function seasonalNotes(){
  const vs = fVeh(); if(!vs.length) return "";
  const today = todayStr(), y = new Date().getFullYear(), md = today.slice(5);
  const out = [];
  const hasOpen = (v, kind, until) => S.tasks.some(t => t.vehicleId===v.id && t.kind===kind && !t.done && t.due && t.due <= until);
  const doneSince = (v, kind, since) => S.tasks.some(t => t.vehicleId===v.id && t.kind===kind && t.done && t.doneDate >= since);
  if(md >= "10-01" && md <= "11-15"){
    const miss = vs.filter(v => !hasOpen(v,"reifen",`${y}-12-01`) && !doneSince(v,"reifen",`${y}-09-01`));
    if(miss.length) out.push({t:"Winterreifen", p:`Von 1. November bis 15. April gilt in Österreich die situative Winterreifenpflicht. Für ${miss.map(v=>esc(v.name)).join(", ")} ist noch kein Reifenwechsel eingetragen.`, act:"seasonTires", data:"winter"});
  }
  if(md >= "03-15" && md <= "04-30"){
    const miss = vs.filter(v => !hasOpen(v,"reifen",`${y}-06-01`) && !doneSince(v,"reifen",`${y}-03-01`));
    if(miss.length) out.push({t:"Sommerreifen", p:`Die Winterreifenpflicht endet am 15. April. Für ${miss.map(v=>esc(v.name)).join(", ")} ist noch kein Wechsel eingetragen.`, act:"seasonTires", data:"summer"});
  }
  if(md >= "11-15" || md <= "01-31"){
    const since = md >= "11-15" ? `${y}-11-01` : `${y-1}-11-01`;
    const miss = vs.filter(v => !S.tasks.some(t => t.vehicleId===v.id && t.kind==="vignette" && (!t.done || t.doneDate >= since)));
    if(miss.length) out.push({t:"Vignette", p:`Die neue Jahresvignette gilt ab 1. Dezember, die alte noch bis 31. Jänner. Noch offen für ${miss.map(v=>esc(v.name)).join(", ")}.`, act:"seasonVignette"});
  }
  if(!out.length) return "";
  return `<div class="notes">${out.map(n=>`<div class="note"><h3>${n.t}</h3><p>${n.p}</p><button class="btn" data-act="${n.act}" data-v="${n.data||""}">Aufgaben eintragen</button></div>`).join("")}</div>`;
}
function seasonTires(kind){
  const y = new Date().getFullYear(), today = todayStr();
  const target = kind === "winter" ? `${y}-10-31` : `${y}-04-20`;
  const due = today <= addDays(target,-7) ? target : addDays(today,7);
  const md = today.slice(5);
  fVeh().forEach(v => {
    const exists = S.tasks.some(t => t.vehicleId===v.id && t.kind==="reifen" && (!t.done || t.doneDate >= (kind==="winter"?`${y}-09-01`:`${y}-03-01`)));
    if(!exists) S.tasks.push({id:uid(), kind:"reifen", title: kind==="winter"?"Winterreifen drauf":"Sommerreifen drauf", due, vehicleId:v.id, memberId:"", notes:"", done:false, files:[]});
  });
  save();
}
function seasonVignette(){
  const y = new Date().getFullYear(), md = todayStr().slice(5);
  const due = md >= "11-15" ? `${y+1}-01-31` : `${y}-01-31`;
  const since = md >= "11-15" ? `${y}-11-01` : `${y-1}-11-01`;
  fVeh().forEach(v => {
    if(!S.tasks.some(t => t.vehicleId===v.id && t.kind==="vignette" && (!t.done || t.doneDate >= since)))
      S.tasks.push({id:uid(), kind:"vignette", title:"Vignette kaufen", due, vehicleId:v.id, memberId:"", notes:"", done:false, files:[]});
  });
  save();
}

/* ================= Ansichten ================= */
function helloBlock(open, late, soon){
  const h = new Date().getHours();
  const greet = h < 11 ? "Guten Morgen!" : h >= 18 ? "Guten Abend!" : "Servus!";
  const ic = h >= 18 || h < 6 ? "moon" : h < 11 ? "sun" : "hand";
  const day = new Date().toLocaleDateString("de-AT",{weekday:"long", day:"numeric", month:"long"});
  const msg = late ? `${late} ${late===1?"Sache ist":"Sachen sind"} überfällig.` : soon ? `${soon} ${soon===1?"Sache steht":"Sachen stehen"} bald an.` : "Alles im grünen Bereich.";
  return `<div class="hello"><div class="hi">${icon(ic)}${greet}</div><div class="sub">${day} · ${msg}</div></div>`;
}
function areaTiles(){
  const t = fTasks().filter(x => !x.done);
  const mk = (key, label, ic, col, items, stFn) => {
    const late = items.filter(x => stFn(x)==="late").length, soon = items.filter(x => stFn(x)==="soon").length;
    const s = late ? `<span class="s bad">${late} überfällig</span>` : soon ? `<span class="s warn">${soon} bald fällig</span>` : `<span class="s">${items.length ? items.length+" offen" : "alles erledigt"}</span>`;
    return `<button class="area" data-act="area" data-v="${key}" style="--ic:var(${col})">${chipIco(ic,col)}<span style="min-width:0"><b>${label}</b>${s}</span></button>`;
  };
  const cons = fContracts().filter(c => contractStatus(c));
  const docs = fDocs().filter(d => d.expiry);
  return `<div class="areas">
    ${mk("auto","Auto","car","--c-auto", t.filter(x=>catOf(x)==="auto"), taskStatus)}
    ${mk("haus","Haus & Wohnung","house","--c-haus", t.filter(x=>catOf(x)==="haus"), taskStatus)}
    ${mk("gesundheit","Gesundheit","heart","--c-ges", t.filter(x=>catOf(x)==="gesundheit"), taskStatus)}
    ${mk("contracts","Verträge","shield","--c-ins", cons, contractStatus)}
    ${mk("docs","Ausweise","passport","--c-doc", docs.filter(d=>docStatus(d)), docStatus)}
  </div>`;
}
function vOverview(){
  const open = fTasks().filter(t => !t.done);
  const late = open.filter(t => taskStatus(t)==="late").length;
  const y = new Date().getFullYear();
  const spent = fTasks().filter(t => t.done && yearOf(t.doneDate)===y).reduce((a,t)=>a+(Number(t.cost)||0),0)
              + fFuel().filter(f => yearOf(f.date)===y).reduce((a,f)=>a+(Number(f.cost)||0),0);
  const fixed = fContracts().reduce((a,c)=>a+yearly(c),0);
  const soonN = open.filter(t => taskStatus(t)==="soon").length + fContracts().filter(c=>contractStatus(c)==="soon").length + fDocs().filter(d=>docStatus(d)==="soon").length;
  const lateN = late + fContracts().filter(c=>contractStatus(c)==="late").length + fDocs().filter(d=>docStatus(d)==="late").length;
  let h = helloBlock(open.length, lateN, soonN) + `<div class="stats">
    <div class="stat"><b>${open.length}</b><span>offene Aufgaben${late?` · <span class="late-txt">${late} überfällig</span>`:""}</span></div>
    <div class="stat"><b>${eur(spent)}</b><span>Ausgaben ${y} (Aufgaben & Tanken)</span></div>
    <div class="stat"><b>${eur(fixed/12)}</b><span>Fixkosten pro Monat (Verträge)</span></div>
    <div class="stat"><b>${eur(fixed)}</b><span>Fixkosten pro Jahr</span></div>
  </div>`;
  if(!S.members.length && !S.vehicles.length){
    return h + `<h2>So fängst du an</h2>` + empty("Leg zuerst die Familienmitglieder an, dann eure Autos. Danach kannst du Pickerl, Reifenwechsel, Thermenwartung, Arzttermine, Verträge und Ausweise eintragen.","addMember","Person hinzufügen");
  }
  h += areaTiles();
  h += newsNote();
  const lb = lastBackup();
  if(!lb || daysUntil(lb) < -30) h += `<div class="notes"><div class="note"><h3>Daten sichern</h3><p>Deine Daten sind nur auf diesem Gerät gespeichert. ${lb?`Der letzte Export war am ${fmtD(lb)}.`:"Du hast noch keinen Export gemacht."} Exportiere sie regelmäßig, damit nichts verloren geht.</p><button class="btn" data-act="goBackup">Jetzt exportieren</button></div></div>`;
  h += seasonalNotes();
  const items = [];
  open.forEach(t => { const st = taskStatus(t); items.push({d: t.due || "9999", st, html: compactTask(t, st)}); });
  fContracts().forEach(c => { const st = contractStatus(c); if(st) items.push({d: deadline(c)||c.renewal, st, html: compactContract(c, st)}); });
  fDocs().forEach(d => { const st = docStatus(d); if(st) items.push({d: d.expiry, st, html: compactDoc(d, st)}); });
  const rank = {late:0, soon:1, "":2};
  items.sort((a,b) => (rank[a.st]-rank[b.st]) || a.d.localeCompare(b.d));
  h += `<h2>Als Nächstes</h2>`;
  h += items.length ? `<div class="clist">${items.slice(0,15).map(i=>i.html).join("")}</div>` : empty("Nichts fällig. Alles erledigt!","addTask","Aufgabe hinzufügen");
  if(items.length > 15) h += `<button class="more-link" data-act="tab" data-v="tasks">Alle ${items.length} anzeigen</button>`;
  return h;
}

function whenCell(dateStr, monthOnly){

    ? `<div class="when">${MONTHS[d.getMonth()]}<small>${d.getFullYear()}</small></div>`
    : `<div class="when">${d.getDate()}.${d.getMonth()+1}.<small>${d.getFullYear()}</small></div>`;

function shortWho(memberId, vehicleId){
  const v = vehicle(vehicleId), m = member(memberId || v?.memberId);

}
function shortDue(t, st){

function fuelStats(vid){
  const e = S.fuel.filter(f => f.vehicleId===vid && Number(f.km)>0).sort((a,b)=>a.km-b.km);
  const r = {cons:null, last:null, costKm:null};
  const fulls = e.map((f,i)=>({f,i})).filter(x=>x.f.full!==false);
  if(fulls.length >= 2){
    const a = fulls[0], b = fulls[fulls.length-1];
    const lit = e.slice(a.i+1, b.i+1).reduce((s,f)=>s+(Number(f.liters)||0),0);
    const cost = e.slice(a.i+1, b.i+1).reduce((s,f)=>s+(Number(f.cost)||0),0);
    const km = b.f.km - a.f.km;
    if(km > 0){ r.cons = lit/km*100; r.costKm = cost/km; }
    const p = fulls[fulls.length-2];
    const lit2 = e.slice(p.i+1, b.i+1).reduce((s,f)=>s+(Number(f.liters)||0),0);
    const km2 = b.f.km - p.f.km; if(km2 > 0) r.last = lit2/km2*100;
  }
  return r;
}

function bars(entries){
  const max = Math.max(1, ...entries.map(e=>e[1]));
  return `<div class="bars">${entries.map(([l,v,c])=>`<div class="b"><span>${l}</span><div class="track"><div class="fill" style="width:${(v/max*100).toFixed(1)}%;${c?`background:${c}`:""}"></div></div><b>${eur(v)}</b></div>`).join("")}</div>`;
}
function vStats(){
  const Y = statYear;
  const tDone = fTasks().filter(t=>t.done), fuel = fFuel(), cons = fContracts();
  const years = [...new Set([new Date().getFullYear(), ...tDone.map(t=>yearOf(t.doneDate)), ...fuel.map(f=>yearOf(f.date))].filter(Boolean))].sort((a,b)=>b-a);
  const inY = s => yearOf(s) === Y;
  const months = Array(12).fill(0);
  tDone.filter(t=>inY(t.doneDate)).forEach(t => months[Number(t.doneDate.slice(5,7))-1] += Number(t.cost)||0);
  fuel.filter(f=>inY(f.date)).forEach(f => months[Number(f.date.slice(5,7))-1] += Number(f.cost)||0);
  const mMax = Math.max(1,...months);
  const catSum = c => tDone.filter(t=>inY(t.doneDate) && catOf(t)===c).reduce((a,t)=>a+(Number(t.cost)||0),0);
  const fuelY = fuel.filter(f=>inY(f.date)).reduce((a,f)=>a+(Number(f.cost)||0),0);
  const insY = cons.filter(c=>c.cat!=="abo").reduce((a,c)=>a+yearly(c),0);
  const aboY = cons.filter(c=>c.cat==="abo").reduce((a,c)=>a+yearly(c),0);
  const byCat = [["Auto – Werkstatt",catSum("auto")],["Auto – Tanken",fuelY],["Haus & Wohnung",catSum("haus")],["Gesundheit",catSum("gesundheit")],["Sonstiges",catSum("sonst")],["Versicherungen*",insY],["Abos & Verträge*",aboY]];
  const total = byCat.reduce((a,e)=>a+e[1],0);
  const byVeh = fVeh().map(v => [esc(v.name),
    tDone.filter(t=>t.vehicleId===v.id && inY(t.doneDate)).reduce((a,t)=>a+(Number(t.cost)||0),0)
    + fuel.filter(f=>f.vehicleId===v.id && inY(f.date)).reduce((a,f)=>a+(Number(f.cost)||0),0)
    + S.contracts.filter(c=>c.vehicleId===v.id).reduce((a,c)=>a+yearly(c),0)]).sort((a,b)=>b[1]-a[1]);
  const byMem = S.members.filter(m=>filter==="all"||m.id===filter).map(m => [`<span class="dot" style="background:${m.color}"></span> ${esc(m.name)}`,
    tDone.filter(t=>inY(t.doneDate) && (t.memberId===m.id || (t.vehicleId && vehicleMember(t.vehicleId)===m.id))).reduce((a,t)=>a+(Number(t.cost)||0),0)
    + fuel.filter(f=>inY(f.date) && vehicleMember(f.vehicleId)===m.id).reduce((a,f)=>a+(Number(f.cost)||0),0)
    + S.contracts.filter(c=>c.memberId===m.id || (c.vehicleId && vehicleMember(c.vehicleId)===m.id)).reduce((a,c)=>a+yearly(c),0), m.color]).sort((a,b)=>b[1]-a[1]);
  const yearTotals = years.slice(0,6).reverse().map(y => [y, tDone.filter(t=>yearOf(t.doneDate)===y).reduce((a,t)=>a+(Number(t.cost)||0),0) + fuel.filter(f=>yearOf(f.date)===y).reduce((a,f)=>a+(Number(f.cost)||0),0)]);
  const yMax = Math.max(1,...yearTotals.map(e=>e[1]));
  return `<div class="bar"><h2>Auswertung</h2><div class="seg">${years.map(y=>`<button data-act="sy" data-v="${y}" aria-pressed="${y===Y}">${y}</button>`).join("")}</div></div>
    <div class="stats" style="margin-bottom:12px"><div class="stat"><b>${eur(total)}</b><span>Gesamtkosten ${Y}</span></div><div class="stat"><b>${eur(total/12)}</b><span>pro Monat im Schnitt</span></div></div>
    <div class="panel"><h3>Ausgaben pro Monat ${Y}</h3><div class="cols">${months.map((v,i)=>`<div class="c" title="${MONTHS[i]}: ${eur(v)}"><i style="height:${(v/mMax*100).toFixed(1)}%"></i><span>${MONTHS[i]}</span></div>`).join("")}</div><p class="sub" style="margin:8px 0 0">Erledigte Aufgaben und Tanken, ohne Verträge.</p></div>
    <div class="panel"><h3>Nach Bereich</h3>${bars(byCat)}<p class="sub" style="margin:8px 0 0">* Verträge nach aktuellen Prämien hochgerechnet aufs Jahr.</p></div>
    ${byVeh.length?`<div class="panel"><h3>Pro Fahrzeug (inkl. Versicherung)</h3>${bars(byVeh)}</div>`:""}
    ${byMem.length?`<div class="panel"><h3>Pro Person</h3>${bars(byMem)}</div>`:""}
    ${yearTotals.length>1?`<div class="panel"><h3>Jahresvergleich (Aufgaben & Tanken)</h3><div class="cols">${yearTotals.map(([y,v])=>`<div class="c" title="${y}: ${eur(v)}"><i style="height:${(v/yMax*100).toFixed(1)}%"></i><span>${y}</span></div>`).join("")}</div></div>`:""}`;
}

async function compress(file){
  if(!file.type.startsWith("image/") || /gif|svg/.test(file.type)) return file;
  try{
    const bmp = await createImageBitmap(file);
    const s = Math.min(1, 1800/Math.max(bmp.width,bmp.height));
    if(s === 1 && file.size < 1.5e6 && /jpeg|png|webp/.test(file.type)) return file;
    const c = document.createElement("canvas"); c.width = Math.round(bmp.width*s); c.height = Math.round(bmp.height*s);
    c.getContext("2d").drawImage(bmp,0,0,c.width,c.height);
    return await new Promise(r => c.toBlob(b => r(b||file), "image/jpeg", 0.85));
  }catch(e){ return file; }
}
function wireFiles(list){
  const box = dlgInner.querySelector("#fList"); if(!box) return;
  const draw = () => {
    box.innerHTML = list.map((f,i) => `<div class="th">${f.type&&f.type.startsWith("image/")?`<img data-fid="${f.id}" alt="${esc(f.name)}">`:"PDF"}<button type="button" class="rm" data-i="${i}" aria-label="${esc(f.name)} entfernen">×</button></div>`).join("");
    hydrate(box);
  };
  box.onclick = e => { const b = e.target.closest(".rm"); if(b){ list.splice(Number(b.dataset.i),1); draw(); } };
  draw();
  const inp = dlgInner.querySelector("#fIn"), st = dlgInner.querySelector("#fState");
  if(!inp) return;
  inp.onchange = async () => {
    const files = [...inp.files]; inp.value = "";
    for(const f of files){
      st.textContent = `Speichert „${f.name}“ …`;
      try{
        const blob = await compress(f);
        const type = blob.type || (f.name.toLowerCase().endsWith(".pdf") ? "application/pdf" : "");
        if(!/^image\/(jpeg|png|webp|gif)$|^application\/pdf$/.test(type)){ st.textContent = `„${f.name}“ hat ein Format, das nicht gespeichert werden kann. Bitte als JPG, PNG oder PDF.`; continue; }
        const id = uid();
        await IDB.put(id, {type, data: await blob.arrayBuffer()});
        list.push({id, name:f.name, type}); requestPersist();
        draw(); st.textContent = "";
      }catch(e){
        st.textContent = e && e.name === "QuotaExceededError" ? "Der Speicher des Geräts ist voll." : `„${f.name}“ konnte nicht gespeichert werden.`;
      }
    }
  };
}
function openDlg(title, body, onSave, onDelete, saveLabel="Speichern"){
  dlgInner.innerHTML = `<div class="dlg-h"><h3>${title}</h3></div><div class="dlg-b">${body}<p class="err" id="dErr" hidden></p></div>
    <div class="dlg-f">${onDelete?`<button class="btn danger" id="dDel" style="margin-right:auto">Löschen</button>`:""}<button class="btn" id="dCancel">Abbrechen</button><button class="btn primary" id="dSave">${saveLabel}</button></div>`;
  dlg.showModal();
  const first = dlgInner.querySelector("input:not([type=file]):not([type=checkbox]),select,textarea"); if(first) first.focus();
  const q = id => dlgInner.querySelector("#"+id);
  q("dCancel").onclick = () => dlg.close();
  q("dSave").onclick = () => {
    const err = onSave(q);
    if(err){ const e = q("dErr"); e.textContent = err; e.hidden = false; return; }
    dlg.close(); save();
  };
  if(onDelete) q("dDel").onclick = () => { if(confirm("Wirklich löschen?")){ onDelete(); dlg.close(); save(); } };
}

function exportMsg(t){ const e = document.getElementById("exportMsg"); if(e) e.textContent = t; }
function loadXLSX(){
  return new Promise((res,rej) => {
    if(window.XLSX) return res();
    const s = document.createElement("script");
    s.src = "https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js";

}
const mName = id => member(id)?.name || "";
const vName = id => vehicle(id) ? vehicle(id).name + (vehicle(id).plate ? " ("+vehicle(id).plate+")" : "") : "";
const n2 = v => v === "" || v == null ? "" : Number(v);
async function exportXlsx(){
  try{
    exportMsg("Excel wird erstellt …");
    await loadXLSX();
    const wb = XLSX.utils.book_new();
    const add = (name, rows) => XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(rows.length?rows:[{Hinweis:"Keine Einträge"}]), name);
    add("Aufgaben", S.tasks.map(t => ({Bereich:CATS[catOf(t)], Art:kindLabel(t), Titel:t.title||"", Fahrzeug:vName(t.vehicleId), Person:mName(t.memberId||vehicleMember(t.vehicleId)), "Fällig":t.due||"", Status:t.done?"erledigt":"offen", "Erledigt am":t.doneDate||"", "Kosten (€)":n2(t.cost), "km-Stand":n2(t.km), Notizen:t.notes||""})));
    add("Verträge", S.contracts.map(c => ({Gruppe:c.cat==="abo"?"Abo/Vertrag":"Versicherung", Art:c.type, Anbieter:c.company||"", Nummer:c.policy||"", Person:mName(c.memberId||vehicleMember(c.vehicleId)), Fahrzeug:vName(c.vehicleId), "Betrag (€)":n2(c.premium), Zahlweise:c.freq, "Pro Jahr (€)":yearly(c), "Ablauf/Verlängerung":effRenewal(c), "Kündigen bis":deadline(c), Notizen:c.notes||""})));
    add("Dokumente", S.docs.map(d => ({Art:d.type, Person:mName(d.memberId), "Gültig bis":d.expiry||"", Nummer:d.number||"", Notizen:d.notes||""})));
    add("Fahrzeuge", S.vehicles.map(v => ({Bezeichnung:v.name, Kennzeichen:v.plate||"", Person:mName(v.memberId), Baujahr:v.year||"", "km-Stand":n2(v.km), Notizen:v.notes||""})));
    add("Tankbuch", S.fuel.slice().sort((a,b)=>(a.date||"").localeCompare(b.date||"")).map(f => ({Datum:f.date, Fahrzeug:vName(f.vehicleId), Liter:n2(f.liters), "Betrag (€)":n2(f.cost), "km-Stand":n2(f.km), Vollgetankt:f.full!==false?"ja":"nein"})));
    add("Familie", S.members.map(m => ({Name:m.name})));
    const buf = XLSX.write(wb, {bookType:"xlsx", type:"array"});
    await saveFile(`Zettelwirtschaft-${todayStr()}.xlsx`, new Blob([buf], {type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"}));
    exportMsg("");
  }catch(e){
    exportMsg(e && e.code === "declined" ? "" : e && e.message === "load" ? "Excel-Funktion konnte nicht geladen werden. Bitte später erneut versuchen." : "Export hat nicht geklappt. Bitte erneut versuchen.");
  }
}
function bufToB64(buf){ const b = new Uint8Array(buf); let s = ""; for(let i=0;i<b.length;i+=0x8000) s += String.fromCharCode.apply(null, b.subarray(i,i+0x8000)); return btoa(s); }
function b64ToBuf(b64){ const s = atob(b64); const u = new Uint8Array(s.length); for(let i=0;i<s.length;i++) u[i] = s.charCodeAt(i); return u.buffer; }
async function exportJson(withFiles){
  try{
    exportMsg("Export wird erstellt …");
    const files = {};
    if(withFiles) for(const id of usedFileIds()){ const r = await IDB.get(id).catch(()=>null); if(r) files[id] = {type:r.type, data:bufToB64(r.data)}; }
    const payload = JSON.stringify({app:"zettelwirtschaft", version:3, exportiert:new Date().toISOString(), data:S, files});
    await saveFile(`Zettelwirtschaft-Export-${todayStr()}${withFiles?"":"-ohne-Fotos"}.json`, new Blob([payload], {type:"application/json"}));
    try{ localStorage.setItem(BKEY, todayStr()); }catch(e){}
    render(); exportMsg("Export gespeichert.");
  }catch(e){
    exportMsg(e && e.code === "declined" ? "" : e && e.code === "too_large" ? "Die Datei ist zu groß. Bitte ohne Fotos exportieren." : "Export hat nicht geklappt. Bitte erneut versuchen.");
  }
}
function importJson(e){
  const f = e.target.files[0]; e.target.value = ""; if(!f) return;
  const r = new FileReader();
  r.onload = async () => {
    let o, data;
    try{ o = JSON.parse(r.result); data = o.data || o; if(!data || (!data.members && !data.tasks && !data.vehicles)) throw 0; }
    catch(err){ exportMsg("Diese Datei ist kein Zettelwirtschaft-Export."); return; }
    const inc = norm(data), files = o.files || {};
    let nf = 0;
    try{ for(const [id,v] of Object.entries(files)){ await IDB.put(id, {type:v.type, data:b64ToBuf(v.data)}); nf++; } }
    catch(err){ exportMsg("Die Fotos konnten nicht alle übernommen werden – der Speicher des Geräts ist eventuell voll."); }
    openDlg("Datei importieren",
      `<p class="hint" style="font-size:14px">In der Datei: ${inc.members.length} Personen, ${inc.vehicles.length} Fahrzeuge, ${inc.tasks.length} Aufgaben, ${inc.contracts.length} Verträge, ${inc.docs.length} Ausweise, ${inc.fuel.length} Tankfüllungen, ${nf} Fotos/PDFs.</p>
       <label class="check"><input type="radio" name="imode" value="merge" checked> Zu den vorhandenen Daten dazufügen</label>
       <label class="check"><input type="radio" name="imode" value="replace"> Alle vorhandenen Daten ersetzen</label>
       <p class="hint">Beim Dazufügen werden gleiche Einträge (z. B. aus einem früheren Export) nicht doppelt angelegt, sondern aktualisiert.</p>`,
      () => {
        const mode = dlgInner.querySelector('input[name="imode"]:checked').value;
        if(mode === "replace") S = inc;
        else Object.keys(inc).forEach(k => { const m = new Map(S[k].map(x => [x.id, x])); inc[k].forEach(x => m.set(x.id, x)); S[k] = [...m.values()]; });
      }, null, "Importieren");
  };
  r.readAsText(f);
}
async function openFile(id, name, type){
  const viewer = document.getElementById("viewer"), vi = document.getElementById("viewerInner");
  const b = await blobFor(id), u = b ? await urlFor(id) : null;
  vi.innerHTML = `<div class="dlg-h"><h3 style="overflow-wrap:anywhere">${esc(name)}</h3></div>
    <div style="padding:4px 20px">${!b ? `<p class="sub">Diese Datei ist auf diesem Gerät nicht vorhanden.</p>` : type.startsWith("image/") ? `<img src="${u}" alt="${esc(name)}" style="max-width:100%;max-height:65vh;border-radius:8px;display:block;margin:0 auto">` : `<p class="sub">PDF-Dateien können hier nicht angezeigt werden. Lade die Datei herunter, um sie zu öffnen.</p>`}</div>
    <div class="dlg-f">${b ? `<button class="btn" id="vDl">Herunterladen</button>` : ""}<button class="btn primary" id="vClose">Schließen</button></div>`;
  viewer.showModal();
  vi.querySelector("#vClose").onclick = () => viewer.close();
  const dl = vi.querySelector("#vDl");
  if(dl) dl.onclick = async () => {
    const ext = {"image/jpeg":"jpg","image/png":"png","image/webp":"webp","image/gif":"gif","application/pdf":"pdf"}[type] || "jpg";
    const base = (name || "Beleg").replace(/\.[^.]+$/, "");
    try{ await saveFile(`${base}.${ext}`, b); }catch(e){}
  };
}

    ${tile("tasks","Aufgaben","check","--c-ges", statusLine(open, taskStatus, n => n ? n+" offen" : "alles erledigt"))}
    ${tile("vehicles","Autos","car","--c-auto", `<span class="s">${fVeh().length} ${fVeh().length===1?"Fahrzeug":"Fahrzeuge"}</span>`)}
    ${tile("contracts","Verträge","shield","--c-ins", statusLine(cons, contractStatus, n => eur(cons.reduce((a,c)=>a+yearly(c),0)/12)+" / Monat"))}
    ${tile("docs","Ausweise","passport","--c-doc", statusLine(fDocs(), docStatus, n => n+" gespeichert"))}
    ${tile("more:family","Familie","user","--c-haus", `<span class="s">${S.members.length} ${S.members.length===1?"Person":"Personen"}</span>`)}
    ${tile("more:stats","Auswertung","chart","--c-abo", `<span class="s">${eur(spent)} heuer</span>`)}
    ${tile("more:backup","Export & Import","download","--c-sonst", `<span class="s">${lastBackup()?"zuletzt "+fmtD(lastBackup()):"noch nie"}</span>`)}
    ${tile("skin","Aussehen & Bedienung","palette","--c-ins", `<span class="s">${(SKINS.find(s=>s[0]===document.documentElement.dataset.skin)||SKINS[0])[1]} · ${(NAVS.find(n=>n[0]===navMode())||NAVS[0])[1]}</span>`)}
  </div>`;
}
function feedItems(){
  const q = feedQuery.trim().toLowerCase();
  const items = [];
  const match = txt => !q || txt.toLowerCase().includes(q);
  if(["all","auto","haus","gesundheit","sonst"].includes(feedCat)) fTasks().filter(t => !t.done && (feedCat==="all" || catOf(t)===feedCat)).forEach(t => {
    if(!match([t.title, kindLabel(t), t.notes, whoText(t.memberId,t.vehicleId)].join(" "))) return;
    const st = taskStatus(t); const d = t.kind==="pickerl" && t.due ? pickerlWindow(t.due).from : t.due;
    items.push({d, st, html: compactTask(t, st)});
  });
  if(["all","contracts"].includes(feedCat)) fContracts().forEach(c => {
    if(!c.renewal || !match([c.type, c.company, c.policy, c.notes, whoText(c.memberId,c.vehicleId)].join(" "))) return;
    const st = contractStatus(c); items.push({d: deadline(c) || c.renewal, st, html: compactContract(c, st)});
  });
  if(["all","docs"].includes(feedCat)) fDocs().forEach(dd => {
    if(!dd.expiry || !match([dd.type, member(dd.memberId)?.name, dd.notes].join(" "))) return;
    const st = docStatus(dd); items.push({d: addMonths(dd.expiry, -docWarn(dd)), st, html: compactDoc(dd, st)});
  });
  return items;
}
function feedListHtml(){
  const items = feedItems();
  if(!items.length) return feedQuery ? empty(`Nichts gefunden für „${esc(feedQuery)}“.`) : empty("Hier ist nichts eingetragen.","quick","Etwas hinzufügen");
  const groups = [["Überfällig",[],"bad"],["Bald fällig",[]],["Nächste 3 Monate",[]],["Später",[]],["Ohne Datum",[]]];
  items.sort((a,b)=>(a.d||"9999").localeCompare(b.d||"9999")).forEach(i => {
    if(i.st === "late") groups[0][1].push(i);
    else if(!i.d) groups[4][1].push(i);
    else if(i.st === "soon") groups[1][1].push(i);
    else if(daysUntil(i.d) <= 92) groups[2][1].push(i);
    else groups[3][1].push(i);
  });
  return groups.filter(g=>g[1].length).map(([l,arr,cls]) => `<div class="fgroup ${cls||""}">${l} · ${arr.length}</div><div class="clist">${arr.map(i=>i.html).join("")}</div>`).join("");
}
function vFeed(){
  if(!S.members.length && !S.vehicles.length){
    return helloBlock(0,0,0) + empty("Leg zuerst die Familienmitglieder an, dann eure Autos. Über das Menü links oben findest du alle Bereiche.","addMember","Person hinzufügen");
  }
  const {open, late, soon} = countStatus();
  const cats = [["all","Alle"],["auto","Auto"],["haus","Haus"],["gesundheit","Gesundheit"],["contracts","Verträge"],["docs","Ausweise"]];
  const lb = lastBackup();
  const backup = (!lb || daysUntil(lb) < -30) ? `<div class="notes"><div class="note"><h3>Daten sichern</h3><p>Deine Daten sind nur auf diesem Gerät gespeichert. Exportiere sie regelmäßig, damit nichts verloren geht.</p><button class="btn" data-act="goBackup">Jetzt exportieren</button></div></div>` : "";
  return helloBlock(open.length, late, soon) + newsNote() + backup + seasonalNotes() +
    `<div class="searchbox" style="margin-top:16px">${icon("search")}<input id="feedSearch" type="search" placeholder="Suchen: Pickerl, Uniqa, Lena …" value="${esc(feedQuery)}" aria-label="Suchen"></div>
     <div class="chips" style="margin:0 0 4px">${cats.map(([k,l])=>`<button class="chip" data-act="fcat" data-v="${k}" aria-pressed="${feedCat===k}">${l}</button>`).join("")}</div>
     <p class="swipehint">${icon("check")}Aufgabe nach rechts wischen oder Häkchen tippen = erledigt</p>
     <div id="feedList">${feedListHtml()}</div>`;
}
function openDrawer(){
  const items = [["feed","Alle Termine","cal","--c-sonst"],["tasks","Aufgaben","check","--c-ges"],["vehicles","Autos","car","--c-auto"],["contracts","Verträge","shield","--c-ins"],["docs","Ausweise","passport","--c-doc"],["more:family","Familie","user","--c-haus"],["more:stats","Auswertung","chart","--c-abo"],["more:backup","Export & Import","download","--c-sonst"],["more:install","Als App nutzen","phone","--c-sonst"],["skin","Aussehen & Bedienung","palette","--c-ins"]];
  const cur = tab === "more" ? "more:"+moreView : tab;
  document.getElementById("drawerInner").innerHTML = `<div style="display:flex;align-items:center;gap:10px;padding:4px 18px 14px"><h3 style="font-size:20px">Zettelwirtschaft</h3></div>` +
    items.map(([v,l,ic,col]) => `<button class="dnav" data-act="go" data-v="${v}" ${cur===v?'aria-current="page"':""}>${chipIco(ic,col)}${l}</button>`).join("");
  document.getElementById("drawer").showModal();
}
function goTo(v){
  const dr = document.getElementById("drawer"); if(dr.open) dr.close();
  if(v === "skin"){ chooseSkin(); return; }
  if(v.startsWith("more:")){ tab = "more"; moreView = v.slice(5); }
  else tab = v;
  render(); window.scrollTo(0,0);
}
const QUICK = [
  ["Auto"],
  ["task:pickerl","Pickerl","pickerl","--c-auto"],["task:reifen","Reifen&shy;wechsel","tire","--c-auto"],["task:service","Service","wrench","--c-auto"],
  ["fuel","Tanken","fuel","--c-auto"],["task:vignette","Vignette","ticket","--c-auto"],["task:reparatur","Reparatur","tools","--c-auto"],
  ["Haus & Gesundheit"],
  ["task:therme","Therme","flame","--c-haus"],["task:rauchfang","Rauchfang&shy;kehrer","chimney","--c-haus"],["task:haus","Haus sonstiges","house","--c-haus"],
  ["task:vorsorge","Vorsorge","heart","--c-ges"],["task:zahnarzt","Zahnarzt","tooth","--c-ges"],["task:arzt","Arzttermin","stetho","--c-ges"],
  ["Verträge & Ausweise"],
  ["contract:ins","Versicherung","shield","--c-ins"],["contract:abo","Abo / Vertrag","phone","--c-abo"],["doc","Ausweis","passport","--c-doc"],
  ["Sonstiges"],
  ["task:sonst","Andere Aufgabe","dots","--c-sonst"],["vehicle","Fahrzeug","car","--c-auto"],["member","Person","user","--c-haus"]
];
function quickAdd(){
  if(dlg.open) dlg.close();
  dlgInner.innerHTML = `<div class="dlg-h"><h3>Was möchtest du eintragen?</h3></div><div class="qgrid">${QUICK.map(q => q.length===1 ? `<div class="qhead">${q[0]}</div>` : `<button class="qbtn" data-act="quickPick" data-v="${q[0]}">${chipIco(q[2],q[3])}<span>${q[1]}</span></button>`).join("")}</div>
    <div class="dlg-f"><button class="btn" id="qClose">Abbrechen</button></div>`;
  dlg.showModal();
  dlgInner.querySelector("#qClose").onclick = () => dlg.close();
}
function quickPick(v){
  if(v === "fuel"){
    const vs = fVeh().length ? fVeh() : S.vehicles;
    if(!vs.length){ dlg.close(); formVehicle(); return; }
    if(vs.length === 1){ dlg.close(); formFuel(null, vs[0].id); return; }
    dlgInner.querySelector(".qgrid").innerHTML = `<div class="qhead">Welches Auto?</div>` + vs.map(x => `<button class="qbtn" data-act="quickFuel" data-veh="${x.id}">${chipIco("car","--c-auto")}<span>${esc(x.name)}</span></button>`).join("");
    return;
  }
  dlg.close();
  if(v.startsWith("task:")) formTask(null, {kind: v.slice(5)});
  else if(v.startsWith("contract:")){ contractView = v.slice(9); formContract(); }
  else if(v === "doc") formDoc();
  else if(v === "vehicle") formVehicle();
  else if(v === "member") formMember();
}
/* Wischen zum Erledigen */
(() => {
  const view = document.getElementById("view");
  let sw = null;
  view.addEventListener("pointerdown", e => {
    const r = e.target.closest(".ci[data-tid]");
    if(!r || e.target.closest(".chk") || e.button > 0) return;
    sw = {r, x:e.clientX, y:e.clientY, dx:0, active:false, id:e.pointerId};
  });
  view.addEventListener("pointermove", e => {
    if(!sw || e.pointerId !== sw.id) return;
    const dx = e.clientX - sw.x, dy = e.clientY - sw.y;
    if(!sw.active){
      if(Math.abs(dx) > 12 && Math.abs(dx) > Math.abs(dy) * 1.3){ sw.active = true; sw.r.classList.add("swiping"); try{ sw.r.setPointerCapture(e.pointerId); }catch(err){} }
      else if(Math.abs(dy) > 12){ sw = null; return; }
    }
    if(sw && sw.active){
      const d = Math.max(0, Math.min(dx, 150)); sw.dx = d;
      sw.r.style.transform = `translateX(${d}px)`;
      sw.r.style.background = `color-mix(in srgb, var(--green) ${Math.round(Math.min(45, d/2.5))}%, var(--paper))`;
    }
  });
  const end = () => {
    if(sw && sw.active){
      const r = sw.r, done = sw.dx > 95;
      r.classList.remove("swiping"); r.style.transform = ""; r.style.background = "";
      suppressClick = true; setTimeout(() => suppressClick = false, 60);
      if(done){ const t = byId(S.tasks, r.dataset.tid); if(t) formDone(t); }
    }
    sw = null;
  };
  view.addEventListener("pointerup", end);
  view.addEventListener("pointercancel", end);
  view.addEventListener("input", e => {
    if(e.target.id === "feedSearch"){ feedQuery = e.target.value; const l = document.getElementById("feedList"); if(l){ l.innerHTML = feedListHtml(); } }
  });
})();
document.getElementById("drawer").addEventListener("click", e => { if(e.target.id === "drawer") e.target.close(); });

loadLocal();
render();
setSync("Nur auf diesem Gerät gespeichert");
initCaps();
if("serviceWorker" in navigator && location.protocol.startsWith("http")) navigator.serviceWorker.register("sw.js").catch(() => {});
document.getElementById("viewer").addEventListener("click", e => { if(e.target.id === "viewer") e.target.close(); });
</script>
